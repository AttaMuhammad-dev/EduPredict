services:
  - type: web
    name: edupredict-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: edupredict_demo
      - key: COOKIE_SECURE
        value: 'true'
      - key: EMAIL_ENABLED
        value: 'false'
      - key: FLASK_DEBUG
        value: 'false'
